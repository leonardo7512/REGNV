<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nota de Venta - FUCAS SPA (Grid Layout)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; color: #333; line-height: 1.6; padding-bottom: 100px; }
        .container { max-width: 1400px; margin: 20px auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #007bff, #0056b3); color: white; padding: 30px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; }
        .form-section { background: white; border-radius: 10px; padding: 30px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-weight: 600; margin-bottom: 5px; color: #374151; }
        .form-group label.required::after { content: " *"; color: #ef4444; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1); }
        
        .form-group input:read-only {
            background-color: #e9ecef;
            cursor: not-allowed;
            pointer-events: none;
        }

        .form-group textarea { min-height: 80px; resize: vertical; }
        
        .input-otros {
            margin-top: 8px;
            display: none;
            padding: 10px;
            border: 2px solid #ffc107;
            border-radius: 6px;
            background-color: #fff9e6;
        }
        .input-otros.show {
            display: block;
        }
        
        .observaciones-helpers {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }
        
        .helper-btn {
            padding: 4px 10px;
            background: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #1976d2;
            transition: all 0.2s;
        }
        
        .helper-btn:hover {
            background: #2196f3;
            color: white;
        }
        
        .helper-btn.has-input {
            background: #fff3cd;
            border-color: #ffc107;
            color: #856404;
        }
        
        .btn { display: inline-block; width: 100%; padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; transition: all 0.3s; text-align: center; }
        .btn-primary { background-color: #28a745; color: white; }
        .btn-primary:hover:not(:disabled) { background-color: #218838; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4); }
        .btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        .floating-button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            max-width: 400px;
            margin: 0 auto;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .floating-button-container .btn {
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }
        
        .status-message { padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; display: none; }
        .status-message.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-message.loading { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .file-input-group { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; }
        
        /* Estilos para botones de cámara/galería */
        .photo-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .photo-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #007bff;
            background: white;
            color: #007bff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .photo-btn:hover {
            background: #007bff;
            color: white;
        }
        
        .photo-btn.active {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }
        
        /* Ocultar inputs de archivo nativos */
        .file-input-group input[type="file"] {
            display: none;
        }
        
        .preview-container { margin-top: 8px; border: 2px dashed #cbd5e1; min-height: 80px; padding: 8px; background-color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .preview-container img { display: block; max-width: 100%; max-height: 120px; height: auto; object-fit: contain; }
        .preview-container small { color: #666; font-size: 11px; }
        .remove-photo-btn { position: absolute; top: 5px; right: 5px; background: #dc3545; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-weight: bold; cursor: pointer; display: none; align-items: center; justify-content: center; font-family: monospace; }
        
        .mass-load-selector { 
            background: linear-gradient(135deg, #17a2b8, #138496); 
            color: white; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: center;
        }
        .mass-load-selector label { 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-right: 10px; 
            color: white;
        }
        .mass-load-selector select { 
            padding: 8px 15px; 
            border-radius: 6px; 
            border: 2px solid white; 
            font-size: 1rem; 
            font-weight: 600;
            cursor: pointer;
        }
        
        /* NUEVO: Grid para múltiples registros */
        #registrosContainer {
            display: grid;
            gap: 20px;
        }
        
        /* 1 registro: 1 columna completa */
        #registrosContainer.cantidad-1 {
            grid-template-columns: 1fr;
        }
        
        /* 2-10 registros: 2 columnas */
        #registrosContainer.cantidad-2,
        #registrosContainer.cantidad-3,
        #registrosContainer.cantidad-4,
        #registrosContainer.cantidad-5,
        #registrosContainer.cantidad-6,
        #registrosContainer.cantidad-7,
        #registrosContainer.cantidad-8,
        #registrosContainer.cantidad-9,
        #registrosContainer.cantidad-10 {
            grid-template-columns: repeat(2, 1fr);
        }
        
        .registro-item { 
            border: 3px solid #007bff; 
            border-radius: 10px; 
            padding: 20px; 
            background: #f8f9fa;
            position: relative;
        }
        
        /* Compactar el registro cuando hay múltiples */
        #registrosContainer:not(.cantidad-1) .registro-item {
            padding: 15px;
        }
        
        #registrosContainer:not(.cantidad-1) .registro-item h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding-bottom: 8px;
        }
        
        #registrosContainer:not(.cantidad-1) .form-grid {
            gap: 12px;
        }
        
        #registrosContainer:not(.cantidad-1) .file-input-group {
            padding: 10px;
        }
        
        .registro-item h3 { 
            color: #007bff; 
            margin-bottom: 20px; 
            font-size: 1.3rem;
            padding-bottom: 10px;
            border-bottom: 2px solid #007bff;
        }
        
        .registro-item h4 {
            text-align: center; 
            border-top: 1px solid #ccc; 
            padding-top: 15px; 
            margin: 15px 0; 
            color: #555;
            font-size: 1rem;
        }
        
        @media (max-width: 1200px) {
            /* En pantallas medianas, solo 1 columna */
            #registrosContainer.cantidad-2,
            #registrosContainer.cantidad-3,
            #registrosContainer.cantidad-4,
            #registrosContainer.cantidad-5,
            #registrosContainer.cantidad-6,
            #registrosContainer.cantidad-7,
            #registrosContainer.cantidad-8,
            #registrosContainer.cantidad-9,
            #registrosContainer.cantidad-10 {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .header h1 { font-size: 1.5rem; }
            .form-section { padding: 20px; }
            .registro-item { padding: 15px; }
            body { padding-bottom: 120px; }
            .observaciones-helpers { gap: 5px; }
            .helper-btn { padding: 5px 10px; font-size: 12px; }
            .floating-button-container {
                left: 10px;
                right: 10px;
                max-width: none;
            }
            .photo-btn {
                font-size: 12px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Registro de Nota de Venta</h1>
            <p>Formulario para el ingreso de notas de venta y sus respaldos (Grid Layout).</p>
        </div>

        <div class="form-section">
            <div class="mass-load-selector">
                <label for="cantidadRegistros">¿Cuántas notas de venta quieres registrar?</label>
                <select id="cantidadRegistros">
                    <option value="1">1 Registro</option>
                    <option value="2">2 Registros</option>
                    <option value="3">3 Registros</option>
                    <option value="4">4 Registros</option>
                    <option value="5">5 Registros</option>
                    <option value="6">6 Registros</option>
                    <option value="7">7 Registros</option>
                    <option value="8">8 Registros</option>
                    <option value="9">9 Registros</option>
                    <option value="10">10 Registros</option>
                </select>
            </div>

            <form id="nvForm" novalidate>
                <div class="form-group full-width" style="background-color: #eef7ff; padding: 15px; border-radius: 8px; margin-bottom: 25px;">
                    <label for="ejecutor" class="required">Tu Nombre (Ejecutor)</label>
                    <select id="ejecutor" required>
                        <option value="" disabled selected>-- Selecciona tu usuario --</option>
                        <option value="JFG">JFG</option>
                        <option value="LCT">LCT</option>
                        <option value="MMC">MMC</option>
                        <option value="OTRO">Otro (especificar)</option>
                    </select>
                    <input type="text" id="ejecutorOtro" class="input-otros" placeholder="Especifica el ejecutor">
                </div>

                <div id="registrosContainer" class="cantidad-1"></div>

            </form>
            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>

    <div class="floating-button-container">
        <button type="submit" form="nvForm" id="submitButton" class="btn btn-primary">
            💾 Guardar Nota de Venta
        </button>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw87DRQRG8fMqJs3Gb5g482GbuW0tz0_tBYF_p4rzpdXyVZCbbq6L0LkAADO0XSWZJy/exec';
        
        const MAX_WIDTH = 1600;
        const QUALITY = 0.8;

        // --- ELEMENTOS DEL DOM ---
        const nvForm = document.getElementById('nvForm');
        const submitButton = document.getElementById('submitButton');
        const statusMessage = document.getElementById('statusMessage');
        const cantidadRegistrosSelect = document.getElementById('cantidadRegistros');
        const registrosContainer = document.getElementById('registrosContainer');
        const ejecutorSelect = document.getElementById('ejecutor');
        const ejecutorOtro = document.getElementById('ejecutorOtro');

        // --- MANEJO DE "OTRO" EN EJECUTOR ---
        ejecutorSelect.addEventListener('change', () => {
            if (ejecutorSelect.value === 'OTRO') {
                ejecutorOtro.classList.add('show');
                ejecutorOtro.required = true;
            } else {
                ejecutorOtro.classList.remove('show');
                ejecutorOtro.required = false;
                ejecutorOtro.value = '';
            }
        });

        // --- FUNCIONES DE UI ---
        function showStatus(message, type = 'loading') {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            statusMessage.style.display = 'block';
        }

        function hideStatus() {
            statusMessage.style.display = 'none';
        }

        function toggleSubmitButton(isDisabled, text = null) {
            submitButton.disabled = isDisabled;
            if (text) submitButton.innerHTML = text;
        }

        // --- FUNCIÓN PARA AGREGAR TEXTO A OBSERVACIONES ---
        function agregarTextoObservaciones(registroNum, texto, requiereInput = false) {
            const textarea = document.getElementById(`observacionesNV${registroNum}`);
            const currentValue = textarea.value.trim();
            
            if (requiereInput) {
                const input = prompt(`Ingresa el detalle para ${texto}:`);
                if (input && input.trim()) {
                    const nuevoTexto = `${texto} ${input.trim()}`;
                    textarea.value = currentValue ? `${currentValue}\n${nuevoTexto}` : nuevoTexto;
                }
            } else {
                textarea.value = currentValue ? `${currentValue}\n${texto}` : texto;
            }
            textarea.focus();
        }

        // --- FUNCIÓN PARA MANEJAR CÁMARA/GALERÍA ---
        function abrirCamara(registroNum, fotoNum) {
            const inputCamera = document.getElementById(`photoNV${registroNum}_${fotoNum}_camera`);
            inputCamera.click();
        }

        function abrirGaleria(registroNum, fotoNum) {
            const inputGallery = document.getElementById(`photoNV${registroNum}_${fotoNum}_gallery`);
            inputGallery.click();
        }

        // --- FUNCIÓN PARA CREAR UN REGISTRO ---
        function crearRegistro(numero) {
            return `
                <div class="registro-item" id="registro${numero}">
                    <h3>📋 NV ${numero}</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="fechaNV${numero}" class="required">Fecha y Hora</label>
                            <input type="datetime-local" id="fechaNV${numero}" readonly>
                        </div>
                        <div class="form-group">
                            <label for="numeroNV${numero}" class="required">Nº Nota Venta</label>
                            <input type="text" id="numeroNV${numero}" required>
                        </div>
                        <div class="form-group">
                            <label for="turnoNV${numero}" class="required">Turno</label>
                            <input type="text" id="turnoNV${numero}" required>
                        </div>
                        <div class="form-group">
                            <label for="vendedorNV${numero}" class="required">Vendedor</label>
                            <select id="vendedorNV${numero}" required>
                                <option value="">-- Vendedor --</option>
                                <option value="AF">AF</option>
                                <option value="YR">YR</option>
                                <option value="LC">LC</option>
                                <option value="JG">JG</option>
                                <option value="LR">LR</option>
                                <option value="ADM">ADM</option>
                                <option value="OTRO">Otro</option>
                            </select>
                            <input type="text" id="vendedorNV${numero}_otro" class="input-otros" placeholder="Especifica">
                        </div>
                        <div class="form-group">
                            <label for="statusNV${numero}" class="required">Status</label>
                            <select id="statusNV${numero}" required>
                                <option value="">-- Status --</option>
                                <option value="PAGADO">PAGADO</option>
                                <option value="POR PAGAR">POR PAGAR</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label for="observacionesNV${numero}">Observaciones</label>
                            <div class="observaciones-helpers">
                                <button type="button" class="helper-btn has-input" onclick="agregarTextoObservaciones(${numero}, 'Efectivo cc', true)">Efectivo CC</button>
                                <button type="button" class="helper-btn" onclick="agregarTextoObservaciones(${numero}, 'Santander')">Santander</button>
                                <button type="button" class="helper-btn" onclick="agregarTextoObservaciones(${numero}, 'Estado')">Estado</button>
                                <button type="button" class="helper-btn" onclick="agregarTextoObservaciones(${numero}, 'Getnet')">Getnet</button>
                                <button type="button" class="helper-btn" onclick="agregarTextoObservaciones(${numero}, 'MP')">MP</button>
                                <button type="button" class="helper-btn" onclick="agregarTextoObservaciones(${numero}, 'Credito')">Crédito</button>
                                <button type="button" class="helper-btn" onclick="agregarTextoObservaciones(${numero}, 'C.Agil')">C.Agil</button>
                                <button type="button" class="helper-btn has-input" onclick="agregarTextoObservaciones(${numero}, 'NC', true)">NC</button>
                            </div>
                            <textarea id="observacionesNV${numero}" placeholder="Forma de pago y observaciones..."></textarea>
                        </div>
                    </div>
                    <h4>📸 Adjuntar Fotos</h4>
                    <div class="form-grid">
                        <div class="form-group file-input-group">
                            <label class="required">Foto 1</label>
                            <div class="photo-buttons">
                                <button type="button" class="photo-btn" onclick="abrirCamara(${numero}, 1)">
                                    📷 Cámara
                                </button>
                                <button type="button" class="photo-btn" onclick="abrirGaleria(${numero}, 1)">
                                    🖼️ Galería
                                </button>
                            </div>
                            <input type="file" id="photoNV${numero}_1_camera" accept="image/*" capture="environment">
                            <input type="file" id="photoNV${numero}_1_gallery" accept="image/*">
                            <div id="previewNV${numero}_1" class="preview-container"><small>Vista previa 1</small></div>
                        </div>
                        <div class="form-group file-input-group">
                            <label>Foto 2 (Opcional)</label>
                            <div class="photo-buttons">
                                <button type="button" class="photo-btn" onclick="abrirCamara(${numero}, 2)">
                                    📷 Cámara
                                </button>
                                <button type="button" class="photo-btn" onclick="abrirGaleria(${numero}, 2)">
                                    🖼️ Galería
                                </button>
                            </div>
                            <input type="file" id="photoNV${numero}_2_camera" accept="image/*" capture="environment">
                            <input type="file" id="photoNV${numero}_2_gallery" accept="image/*">
                            <div id="previewNV${numero}_2" class="preview-container"><small>Vista previa 2</small></div>
                        </div>
                        <div class="form-group file-input-group">
                            <label>Foto 3 (Opcional)</label>
                            <div class="photo-buttons">
                                <button type="button" class="photo-btn" onclick="abrirCamara(${numero}, 3)">
                                    📷 Cámara
                                </button>
                                <button type="button" class="photo-btn" onclick="abrirGaleria(${numero}, 3)">
                                    🖼️ Galería
                                </button>
                            </div>
                            <input type="file" id="photoNV${numero}_3_camera" accept="image/*" capture="environment">
                            <input type="file" id="photoNV${numero}_3_gallery" accept="image/*">
                            <div id="previewNV${numero}_3" class="preview-container"><small>Vista previa 3</small></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- FUNCIONES AUXILIARES ---
        function configurarCamposCondicionales(registroNum) {
            const vendedorSelect = document.getElementById(`vendedorNV${registroNum}`);
            const vendedorOtro = document.getElementById(`vendedorNV${registroNum}_otro`);
            
            if (vendedorSelect && vendedorOtro) {
                vendedorSelect.addEventListener('change', () => {
                    if (vendedorSelect.value === 'OTRO') {
                        vendedorOtro.classList.add('show');
                        vendedorOtro.required = true;
                    } else {
                        vendedorOtro.classList.remove('show');
                        vendedorOtro.required = false;
                        vendedorOtro.value = '';
                    }
                });
            }
        }

        function previewFile(registroNum, fotoNum, file) {
            const preview = document.getElementById(`previewNV${registroNum}_${fotoNum}`);
            
            preview.innerHTML = '';
            
            if (file) {
                const small = document.createElement('small');
                small.textContent = 'Cargando...';
                preview.appendChild(small);

                const reader = new FileReader();
                reader.onload = e => {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Previsualización"><button type="button" class="remove-photo-btn" title="Quitar foto" style="display:flex;">X</button>`;
                    
                    // Marcar botones como activos
                    const btnCamera = preview.parentElement.querySelector('.photo-buttons .photo-btn:first-child');
                    const btnGallery = preview.parentElement.querySelector('.photo-buttons .photo-btn:last-child');
                    if (btnCamera && btnGallery) {
                        btnCamera.classList.add('active');
                        btnGallery.classList.add('active');
                    }
                };
                reader.readAsDataURL(file);
            } else {
                const small = document.createElement('small');
                small.textContent = `Vista previa ${fotoNum}`;
                preview.appendChild(small);
                
                // Remover clase activa de botones
                const btnCamera = preview.parentElement.querySelector('.photo-buttons .photo-btn:first-child');
                const btnGallery = preview.parentElement.querySelector('.photo-buttons .photo-btn:last-child');
                if (btnCamera && btnGallery) {
                    btnCamera.classList.remove('active');
                    btnGallery.classList.remove('active');
                }
            }
        }

        function inicializarPrevisualizaciones(registroNum) {
            for (let fotoNum = 1; fotoNum <= 3; fotoNum++) {
                const inputCamera = document.getElementById(`photoNV${registroNum}_${fotoNum}_camera`);
                const inputGallery = document.getElementById(`photoNV${registroNum}_${fotoNum}_gallery`);
                const preview = document.getElementById(`previewNV${registroNum}_${fotoNum}`);
                
                if (inputCamera) {
                    inputCamera.addEventListener('change', (e) => {
                        if (e.target.files[0]) {
                            // Copiar archivo al otro input también
                            const dt = new DataTransfer();
                            dt.items.add(e.target.files[0]);
                            inputGallery.files = dt.files;
                            previewFile(registroNum, fotoNum, e.target.files[0]);
                        }
                    });
                }
                
                if (inputGallery) {
                    inputGallery.addEventListener('change', (e) => {
                        if (e.target.files[0]) {
                            // Copiar archivo al otro input también
                            const dt = new DataTransfer();
                            dt.items.add(e.target.files[0]);
                            inputCamera.files = dt.files;
                            previewFile(registroNum, fotoNum, e.target.files[0]);
                        }
                    });
                }
                
                if (preview) {
                    preview.addEventListener('click', (e) => {
                        if (e.target.classList.contains('remove-photo-btn')) {
                            inputCamera.value = '';
                            inputGallery.value = '';
                            previewFile(registroNum, fotoNum, null);
                        }
                    });
                }
            }
        }

        function setInitialDateTime(registroNum) {
            const now = new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const formattedDateTime = `${year}-${month}-${day}T${hours}:${minutes}`;
            
            const fechaInput = document.getElementById(`fechaNV${registroNum}`);
            if (fechaInput) {
                fechaInput.value = formattedDateTime;
            }
        }

        function actualizarRegistros() {
            const cantidad = parseInt(cantidadRegistrosSelect.value);
            registrosContainer.innerHTML = '';
            
            // Actualizar la clase del container para el grid
            registrosContainer.className = `cantidad-${cantidad}`;
            
            for (let i = 1; i <= cantidad; i++) {
                registrosContainer.innerHTML += crearRegistro(i);
            }
            
            for (let i = 1; i <= cantidad; i++) {
                setInitialDateTime(i);
                inicializarPrevisualizaciones(i);
                configurarCamposCondicionales(i);
            }
            
            if (cantidad > 1) {
                submitButton.innerHTML = `💾 Guardar ${cantidad} Notas de Venta`;
            } else {
                submitButton.innerHTML = '💾 Guardar Nota de Venta';
            }
        }

        // --- SISTEMA DE COMPRESIÓN DE IMÁGENES ---
        function comprimirImagen(file) {
            return new Promise((resolve, reject) => {
                if (!file) return resolve(null);
                
                if (!file.type.match(/image.*/)) {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve({
                        fileName: file.name,
                        mimeType: file.type,
                        base64Data: e.target.result.split(',')[1]
                    });
                    reader.readAsDataURL(file);
                    return;
                }

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', QUALITY);
                        const base64String = dataUrl.split(',')[1];
                        
                        resolve({
                            fileName: file.name,
                            mimeType: 'image/jpeg',
                            base64Data: base64String
                        });
                    };
                    img.onerror = (err) => reject(new Error("Error al procesar imagen interna"));
                };
                reader.onerror = (err) => reject(new Error("Error de lectura de archivo"));
            });
        }

        // --- RECOPILAR DATOS ---
        async function recopilarDatosRegistro(registroNum) {
            const numeroNV = document.getElementById(`numeroNV${registroNum}`).value.trim();
            const turnoNV = document.getElementById(`turnoNV${registroNum}`).value.trim();
            const statusNV = document.getElementById(`statusNV${registroNum}`).value;
            const observacionesNV = document.getElementById(`observacionesNV${registroNum}`).value.trim();
            
            const vendedorSelect = document.getElementById(`vendedorNV${registroNum}`).value;
            const vendedorOtro = document.getElementById(`vendedorNV${registroNum}_otro`).value.trim();
            const vendedorNV = vendedorSelect === 'OTRO' ? vendedorOtro : vendedorSelect;
            
            if (!numeroNV || !turnoNV || !vendedorNV || !statusNV) {
                throw new Error(`Registro ${registroNum}: Faltan campos obligatorios`);
            }
            
            // Verificar que al menos uno de los inputs tenga archivo (camera o gallery)
            const photo1Camera = document.getElementById(`photoNV${registroNum}_1_camera`);
            const photo1Gallery = document.getElementById(`photoNV${registroNum}_1_gallery`);
            
            if (!photo1Camera.files[0] && !photo1Gallery.files[0]) {
                throw new Error(`Registro ${registroNum}: La foto 1 es obligatoria`);
            }
            
            const photoPromises = [
                comprimirImagen(photo1Camera.files[0] || photo1Gallery.files[0]),
                comprimirImagen(document.getElementById(`photoNV${registroNum}_2_camera`).files[0] || document.getElementById(`photoNV${registroNum}_2_gallery`).files[0]),
                comprimirImagen(document.getElementById(`photoNV${registroNum}_3_camera`).files[0] || document.getElementById(`photoNV${registroNum}_3_gallery`).files[0])
            ];
            
            const [photoInfo1, photoInfo2, photoInfo3] = await Promise.all(photoPromises);
            
            return {
                fechaNV: new Date().toISOString(),
                numeroNV,
                turnoNV,
                vendedorNV,
                statusNV,
                observacionesNV,
                photoInfo1,
                photoInfo2,
                photoInfo3
            };
        }

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            actualizarRegistros();
        });

        cantidadRegistrosSelect.addEventListener('change', () => {
            actualizarRegistros();
        });

        // --- ENVÍO DEL FORMULARIO ---
        nvForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            hideStatus();

            const ejecutorValue = ejecutorSelect.value;
            let ejecutor = ejecutorValue;
            if (ejecutorValue === 'OTRO') {
                ejecutor = ejecutorOtro.value.trim();
                if (!ejecutor) {
                    showStatus('Error: Debes especificar el nombre del ejecutor.', 'error');
                    return;
                }
            } else if (!ejecutorValue) {
                showStatus('Error: Debes seleccionar un ejecutor.', 'error');
                return;
            }

            const cantidad = parseInt(cantidadRegistrosSelect.value);
            
            toggleSubmitButton(true, '⏳ Comprimiendo y Enviando...');
            showStatus(`Procesando imágenes y enviando ${cantidad} registro(s)...`, 'loading');

            try {
                const registrosPromises = [];
                for (let i = 1; i <= cantidad; i++) {
                    registrosPromises.push(recopilarDatosRegistro(i));
                }
                
                const registrosData = await Promise.all(registrosPromises);
                
                registrosData.forEach(registro => {
                    registro.user = ejecutor;
                });
                
                showStatus(`Enviando datos optimizados al servidor...`, 'loading');

                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        registros: registrosData,
                        cantidadRegistros: cantidad
                    })
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    showStatus(
                        result.message || `¡${cantidad} nota(s) de venta guardada(s) con éxito!`, 
                        'success'
                    );
                    nvForm.reset();
                    cantidadRegistrosSelect.value = '1';
                    actualizarRegistros();
                } else {
                    throw new Error(result.message || 'Ocurrió un error desconocido en el servidor.');
                }

            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                console.error('Error en el proceso de envío:', error);
            } finally {
                toggleSubmitButton(false, '💾 Guardar Nota de Venta');
                setTimeout(hideStatus, 10000);
            }
        });
    </script>
</body>
</html>
