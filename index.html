<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nota de Venta / Devoluciones - FUCAS SPA (Tabs)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; color: #333; line-height: 1.6; padding-bottom: 100px; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #007bff, #0056b3); color: white; padding: 30px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; }
        .form-section { background: white; border-radius: 10px; padding: 30px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-weight: 600; margin-bottom: 5px; color: #374151; }
        .form-group label.required::after { content: " *"; color: #ef4444; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1); }
        
        .form-group input:read-only {
            background-color: #e9ecef;
            cursor: not-allowed;
            pointer-events: none;
        }

        .form-group textarea { min-height: 80px; resize: vertical; }
        
        .input-otros {
            margin-top: 8px;
            display: none;
            padding: 10px;
            border: 2px solid #ffc107;
            border-radius: 6px;
            background-color: #fff9e6;
        }
        .input-otros.show {
            display: block;
        }
        
        .observaciones-helpers {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }
        
        .helper-btn {
            padding: 4px 10px;
            background: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #1976d2;
            transition: all 0.2s;
        }
        
        .helper-btn:hover {
            background: #2196f3;
            color: white;
        }
        
        .helper-btn.has-input {
            background: #fff3cd;
            border-color: #ffc107;
            color: #856404;
        }
        
        .btn { display: inline-block; width: 100%; padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; transition: all 0.3s; text-align: center; }
        .btn-primary { background-color: #28a745; color: white; }
        .btn-primary:hover:not(:disabled) { background-color: #218838; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4); }
        .btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        .status-message { padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; display: none; }
        .status-message.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-message.loading { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .file-input-group { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; }
        
        /* Estilos para botones de cámara/galería */
        .photo-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .photo-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #007bff;
            background: white;
            color: #007bff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .photo-btn:hover {
            background: #007bff;
            color: white;
        }
        
        .photo-btn.active {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }
        
        .file-input-group input[type="file"] {
            display: none;
        }
        
        .preview-container { margin-top: 8px; border: 2px dashed #cbd5e1; min-height: 80px; padding: 8px; background-color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .preview-container img { display: block; max-width: 100%; max-height: 120px; height: auto; object-fit: contain; }
        .preview-container small { color: #666; font-size: 11px; }
        .remove-photo-btn { position: absolute; top: 5px; right: 5px; background: #dc3545; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-weight: bold; cursor: pointer; display: none; align-items: center; justify-content: center; font-family: monospace; }
        
        .mass-load-selector { 
            background: linear-gradient(135deg, #17a2b8, #138496); 
            color: white; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: center;
        }
        .mass-load-selector label { 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-right: 10px; 
            color: white;
        }
        .mass-load-selector select { 
            padding: 8px 15px; 
            border-radius: 6px; 
            border: 2px solid white; 
            font-size: 1rem; 
            font-weight: 600;
            cursor: pointer;
        }
        
        /* SISTEMA DE PESTAÑAS */
        .tabs-container {
            margin-bottom: 20px;
        }
        
        .tabs-nav {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 3px solid #e5e7eb;
        }
        
        .tab-button {
            padding: 12px 20px;
            background: #e5e7eb;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #6b7280;
            transition: all 0.3s;
            white-space: nowrap;
            position: relative;
            min-width: 100px;
        }
        
        .tab-button:hover {
            background: #d1d5db;
        }
        
        .tab-button.active {
            background: #007bff;
            color: white;
            transform: translateY(2px);
        }
        
        .tab-button.completed {
            background: #28a745;
            color: white;
        }
        
        .tab-button.completed::after {
            content: "✓";
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 12px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .registro-item { 
            border: 3px solid #007bff; 
            border-radius: 10px; 
            padding: 20px; 
            background: #f8f9fa;
        }
        
        .registro-item h3 { 
            color: #007bff; 
            margin-bottom: 20px; 
            font-size: 1.3rem;
            padding-bottom: 10px;
            border-bottom: 2px solid #007bff;
        }
        
        .registro-item h4 {
            text-align: center; 
            border-top: 1px solid #ccc; 
            padding-top: 15px; 
            margin: 15px 0; 
            color: #555;
            font-size: 1rem;
        }
        
        /* NAVEGACIÓN DE PESTAÑAS */
        .tab-navigation {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e5e7eb;
        }
        
        .nav-btn {
            flex: 1;
            padding: 12px 24px;
            border: 2px solid #007bff;
            background: white;
            color: #007bff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .nav-btn:hover:not(:disabled) {
            background: #007bff;
            color: white;
        }
        
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        /* BOTÓN FLOTANTE */
        .floating-button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            max-width: 400px;
            margin: 0 auto;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .floating-button-container .btn {
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }
        
        /* MODAL DE CONFIRMACIÓN */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }
        
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideDown 0.3s;
        }
        
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #007bff;
            text-align: center;
        }
        
        .modal-body {
            margin-bottom: 25px;
            text-align: center;
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .modal-btn.confirm {
            background: #28a745;
            color: white;
        }
        
        .modal-btn.confirm:hover {
            background: #218838;
        }
        
        .modal-btn.cancel {
            background: #6c757d;
            color: white;
        }
        
        .modal-btn.cancel:hover {
            background: #5a6268;
        }
        
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .header h1 { font-size: 1.5rem; }
            .form-section { padding: 20px; }
            .registro-item { padding: 15px; }
            body { padding-bottom: 120px; }
            .observaciones-helpers { gap: 5px; }
            .helper-btn { padding: 5px 10px; font-size: 12px; }
            .floating-button-container {
                left: 10px;
                right: 10px;
                max-width: none;
            }
            .photo-btn {
                font-size: 12px;
                padding: 8px;
            }
            .tab-button {
                padding: 10px 15px;
                font-size: 13px;
                min-width: 80px;
            }
            .tabs-nav {
                gap: 3px;
            }
        }

        /* ================= MODO DEVOLUCIÓN ================= */
        [hidden] { display: none !important; }

        .header.modo-dev { background: linear-gradient(135deg, #e8590c, #c2410c); }

        .selector-modo {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            background: rgba(255,255,255,0.18);
            padding: 5px;
            border-radius: 10px;
        }
        .selector-modo button {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        .selector-modo button.activo {
            background: white;
            color: #0056b3;
        }
        .header.modo-dev .selector-modo button.activo { color: #c2410c; }

        .dev-id { font-size: 13px; color: #6b7280; margin-bottom: 15px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .dev-id b { color: #333; }
        .dev-estado-fotos { font-weight: 600; color: #007bff; }

        .dev-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .dev-chip {
            padding: 8px 14px;
            border: 2px solid #e5e7eb;
            background: white;
            color: #374151;
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
        }
        .dev-chip.sel { border-color: #007bff; background: #e3f2fd; color: #0056b3; font-weight: 700; }
        .dev-chip.sel.verde { border-color: #28a745; background: #d4edda; color: #155724; }
        .dev-chip.sel.rojo { border-color: #dc3545; background: #f8d7da; color: #721c24; }
        .dev-chip.sel.naranja { border-color: #fd7e14; background: #fff3cd; color: #856404; }

        .dev-bloque { margin-bottom: 20px; }
        .dev-bloque > label { font-weight: 600; margin-bottom: 8px; color: #374151; display: block; }
        .dev-bloque > label.required::after { content: " *"; color: #ef4444; }

        .dev-cantidad { display: flex; gap: 8px; align-items: center; }
        .dev-cantidad button {
            width: 44px; height: 44px; border-radius: 8px; border: 2px solid #e5e7eb;
            background: white; font-size: 22px; cursor: pointer;
        }
        .dev-cantidad input { width: 90px; text-align: center; font-size: 18px; font-weight: 700; }

        .dev-aviso {
            margin-top: 8px; padding: 10px; border-radius: 6px; font-size: 13px;
            background: #fff3cd; color: #856404; border: 1px solid #ffeeba;
        }

        .dev-oculto { display: none; }
        .dev-galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 8px; margin-top: 10px; }
        .dev-foto { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 2px solid #e5e7eb; background: #f8fafc; }
        .dev-foto.error { border-color: #dc3545; }
        .dev-foto img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
        .dev-foto .marca {
            position: absolute; left: 4px; bottom: 4px; font-size: 11px; padding: 2px 6px;
            border-radius: 5px; background: rgba(0,0,0,0.65); color: white;
        }
        .dev-foto .quitar {
            position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%;
            border: none; background: #dc3545; color: white; font-weight: bold; cursor: pointer;
        }

        .dev-lista-item { padding: 10px 0; border-bottom: 1px solid #e5e7eb; }
        .dev-lista-item:last-child { border-bottom: none; }
        .dev-lista-item .l1 { font-weight: 600; }
        .dev-lista-item .l2 { font-size: 13px; color: #6b7280; }
        .dev-etiqueta { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; margin-left: 4px; }
        .dev-etiqueta.pend { background: #fff3cd; color: #856404; }
        .dev-etiqueta.cerr { background: #d4edda; color: #155724; }

        .dev-recargar {
            padding: 6px 12px; border: 2px solid #007bff; background: white; color: #007bff;
            border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
        }

        .btn-dev { background-color: #e8590c; color: white; }
        .btn-dev:hover:not(:disabled) { background-color: #c2410c; }

        #devToast {
            position: fixed; left: 50%; bottom: 95px; transform: translateX(-50%);
            max-width: 90%; padding: 12px 16px; border-radius: 10px; z-index: 3000;
            background: #1f2937; color: white; font-size: 15px; text-align: center; display: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        #devToast.error { background: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" id="encabezado">
            <h1 id="tituloPagina">Registro de Nota de Venta</h1>
            <p id="subtituloPagina">Sistema de pestañas para registro múltiple</p>
            <div class="selector-modo">
                <button type="button" id="botonModoNV" class="activo">🧾 Notas de venta</button>
                <button type="button" id="botonModoDev">↩️ Modo devolución</button>
            </div>
        </div>

        <div class="form-section" id="seccionNV">
            <div class="mass-load-selector">
                <label for="cantidadRegistros">¿Cuántas notas de venta quieres registrar?</label>
                <select id="cantidadRegistros">
                    <option value="1">1 Registro</option>
                    <option value="2">2 Registros</option>
                    <option value="3">3 Registros</option>
                    <option value="4">4 Registros</option>
                    <option value="5">5 Registros</option>
                    <option value="6">6 Registros</option>
                    <option value="7">7 Registros</option>
                    <option value="8">8 Registros</option>
                    <option value="9">9 Registros</option>
                    <option value="10">10 Registros</option>
                </select>
            </div>

            <form id="nvForm" novalidate>
                <div class="form-group full-width" style="background-color: #eef7ff; padding: 15px; border-radius: 8px; margin-bottom: 25px;">
                    <label for="ejecutor" class="required">Tu Nombre (Ejecutor)</label>
                    <select id="ejecutor" required>
                        <option value="" disabled selected>-- Selecciona tu usuario --</option>
                        <option value="JFG">JFG</option>
                        <option value="LCT">LCT</option>
                        <option value="MMC">MMC</option>
                        <option value="CF">CF</option>
                        <option value="OTRO">Otro (especificar)</option>
                    </select>
                    <input type="text" id="ejecutorOtro" class="input-otros" placeholder="Especifica el ejecutor">
                </div>

                <div class="tabs-container">
                    <div class="tabs-nav" id="tabsNav"></div>
                    <div id="tabsContent"></div>
                </div>

            </form>
            <div id="statusMessage" class="status-message"></div>
        </div>

        <!-- ================= MODO DEVOLUCIÓN ================= -->
        <div class="form-section" id="seccionDev" hidden>
            <div class="dev-id">
                <span>ID: <b id="devId"></b></span>
                <span id="devEstadoFotos" class="dev-estado-fotos">Sin fotos</span>
            </div>

            <div class="dev-bloque">
                <label class="required">Canal de la venta</label>
                <div class="dev-chips" id="devChipsCanal"></div>
            </div>

            <div class="dev-bloque" id="devBloqueVendedor" hidden>
                <label class="required">Vendedor</label>
                <div class="dev-chips" id="devChipsVendedor"></div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="devDocumento" id="devLblDocumento">N° documento</label>
                    <input type="text" id="devDocumento" autocomplete="off" placeholder="Ej: 34425">
                    <div class="dev-aviso" id="devAvisoDocumento" hidden></div>
                </div>
                <div class="form-group">
                    <label for="devCliente">Cliente (opcional)</label>
                    <input type="text" id="devCliente" autocomplete="off" placeholder="Nombre o RUT">
                </div>
                <div class="form-group full-width">
                    <label for="devProducto" class="required">Producto(s) devuelto(s)</label>
                    <textarea id="devProducto" placeholder="Ej: FC123 Lata Sani-Air Lavanda"></textarea>
                </div>
                <div class="form-group">
                    <label for="devCantidad">Cantidad</label>
                    <div class="dev-cantidad">
                        <button type="button" id="devMenos">−</button>
                        <input type="number" id="devCantidad" inputmode="numeric" min="1" value="1">
                        <button type="button" id="devMas">+</button>
                    </div>
                </div>
            </div>

            <div class="dev-bloque">
                <label class="required">Estado del producto</label>
                <div class="dev-chips" id="devChipsEstado"></div>
            </div>

            <div class="dev-bloque">
                <label>Motivo</label>
                <div class="dev-chips" id="devChipsMotivo"></div>
            </div>

            <div class="form-group full-width dev-bloque">
                <label for="devNota">Descripción / nota</label>
                <textarea id="devNota" placeholder="Qué trae, en qué condición viene, quién lo trajo, etc."></textarea>
            </div>

            <div class="dev-bloque file-input-group">
                <label class="required">📸 Fotos (todas las que necesites)</label>
                <div class="photo-buttons">
                    <button type="button" class="photo-btn" id="devBotonCamara">📷 Cámara</button>
                    <button type="button" class="photo-btn" id="devBotonGaleria">🖼️ Galería</button>
                </div>
                <input type="file" id="devInputCamara" class="dev-oculto" accept="image/*" capture="environment">
                <input type="file" id="devInputGaleria" class="dev-oculto" accept="image/*" multiple>
                <div class="dev-galeria" id="devGaleria"></div>
            </div>

            <div class="dev-bloque">
                <label>Resolución</label>
                <div class="dev-chips" id="devChipsResolucion"></div>
            </div>

            <div class="form-grid">
                <div class="form-group" id="devBloqueNumeroResol" hidden>
                    <label for="devNumeroResol" id="devLblNumeroResol">N° de documento</label>
                    <input type="text" id="devNumeroResol" inputmode="numeric" autocomplete="off" placeholder="Si aún no existe, déjalo vacío">
                </div>
                <div class="form-group">
                    <label for="devRecibidoPor" class="required">Recibido por</label>
                    <input type="text" id="devRecibidoPor" autocomplete="off" placeholder="Tu nombre (queda guardado en este teléfono)">
                </div>
            </div>

            <h4 style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #ccc; padding-top:15px; margin:15px 0; color:#555;">
                <span>📋 Últimas devoluciones</span>
                <button type="button" class="dev-recargar" id="devRecargar">↻ Actualizar</button>
            </h4>
            <div id="devLista"><div class="dev-lista-item l2">Cargando…</div></div>
        </div>
    </div>

    <div class="floating-button-container" id="botonGuardarNV">
        <button type="submit" form="nvForm" id="submitButton" class="btn btn-primary">
            💾 Guardar Nota de Venta
        </button>
    </div>

    <div class="floating-button-container" id="botonGuardarDev" hidden>

        const MAX_WIDTH = 1600;
        const QUALITY = 0.8;

        // --- ELEMENTOS DEL DOM ---

        const tabsContent = document.getElementById('tabsContent');
        const ejecutorSelect = document.getElementById('ejecutor');

        const confirmModal = document.getElementById('confirmModal');
        const modalBody = document.getElementById('modalBody');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');

        let currentTab = 1;
        let totalTabs = 1;

        // --- MANEJO DE "OTRO" EN EJECUTOR ---
        ejecutorSelect.addEventListener('change', () => {
            if (ejecutorSelect.value === 'OTRO') {
                ejecutorOtro.classList.add('show');
                ejecutorOtro.required = true;
            } else {
                ejecutorOtro.classList.remove('show');
                ejecutorOtro.required = false;
                ejecutorOtro.value = '';

        // --- MODAL ---

        function showStatus(message, type = 'loading') {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;

        // --- FUNCIÓN PARA AGREGAR TEXTO A OBSERVACIONES ---
        function agregarTextoObservaciones(registroNum, texto, requiereInput = false) {
            const textarea = document.getElementById(`observacionesNV${registroNum}`);
            const currentValue = textarea.value.trim();
            
            if (requiereInput) {
                const input = prompt(`Ingresa el detalle para ${texto}:`);
                if (input && input.trim()) {
                    const nuevoTexto = `${texto} ${input.trim()}`;
                    textarea.value = currentValue ? `${currentValue}\n${nuevoTexto}` : nuevoTexto;
                }
            } else {
                textarea.value = currentValue ? `${currentValue}\n${texto}` : texto;
            }
            textarea.focus();
        }

        // --- NAVEGACIÓN DE PESTAÑAS ---
        function cambiarTab(tabNum) {
            // Ocultar todas las pestañas
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Mostrar la pestaña seleccionada
            const selectedTab = document.getElementById(`tabContent${tabNum}`);
            const selectedBtn = document.getElementById(`tabButton${tabNum}`);
            
            if (selectedTab && selectedBtn) {
                selectedTab.classList.add('active');
                selectedBtn.classList.add('active');
                currentTab = tabNum;
                
                // Scroll al botón de la pestaña
                selectedBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function siguienteTab() {
            marcarTabComoCompleta(currentTab);
            if (currentTab < totalTabs) {
                cambiarTab(currentTab + 1);
            }
        }

        function anteriorTab() {
            if (currentTab > 1) {
                cambiarTab(currentTab - 1);
            }
        }

        function marcarTabComoCompleta(tabNum) {
            const btn = document.getElementById(`tabButton${tabNum}`);
            if (btn && esTabCompleta(tabNum)) {
                btn.classList.add('completed');
            }

        function esTabCompleta(tabNum) {
            const numeroNV = document.getElementById(`numeroNV${tabNum}`);
            const turnoNV = document.getElementById(`turnoNV${tabNum}`);
            const vendedorNV = document.getElementById(`vendedorNV${tabNum}`);
            const statusNV = document.getElementById(`statusNV${tabNum}`);
            const photo1Camera = document.getElementById(`photoNV${tabNum}_1_camera`);
            const photo1Gallery = document.getElementById(`photoNV${tabNum}_1_gallery`);
            
            return numeroNV && numeroNV.value.trim() &&
                   turnoNV && turnoNV.value.trim() &&
                   vendedorNV && vendedorNV.value &&
                   statusNV && statusNV.value &&
                   (photo1Camera.files[0] || photo1Gallery.files[0]);
        }

        // --- FUNCIÓN PARA CREAR UN REGISTRO ---
        function crearRegistro(numero) {

                                        📷 Cámara
                                    </button>
                                    <button type="button" class="photo-btn" onclick="abrirGaleria(${numero}, 1)">
                                        🖼️ Galería
                                    </button>
                                </div>
                                <input type="file" id="photoNV${numero}_1_camera" accept="image/*" capture="environment">
                                <input type="file" id="photoNV${numero}_1_gallery" accept="image/*">
                                <div id="previewNV${numero}_1" class="preview-container"><small>Vista previa 1</small></div>

                                <label>Foto 2 (Opcional)</label>
                                <div class="photo-buttons">
                                    <button type="button" class="photo-btn" onclick="abrirCamara(${numero}, 2)">
                                        📷 Cámara
                                    </button>
                                    <button type="button" class="photo-btn" onclick="abrirGaleria(${numero}, 2)">
                                        🖼️ Galería
                                    </button>
                                </div>
                                <input type="file" id="photoNV${numero}_2_camera" accept="image/*" capture="environment">
                                <input type="file" id="photoNV${numero}_2_gallery" accept="image/*">
                                <div id="previewNV${numero}_2" class="preview-container"><small>Vista previa 2</small></div>
                            </div>
                            <div class="form-group file-input-group">
                                <label>Foto 3 (Opcional)</label>
                                <div class="photo-buttons">
                                    <button type="button" class="photo-btn" onclick="abrirCamara(${numero}, 3)">
                                        📷 Cámara
                                    </button>
                                    <button type="button" class="photo-btn" onclick="abrirGaleria(${numero}, 3)">
                                        🖼️ Galería
                                    </button>
                                </div>
                                <input type="file" id="photoNV${numero}_3_camera" accept="image/*" capture="environment">

        }

        // --- FUNCIONES AUXILIARES ---
        function configurarCamposCondicionales(registroNum) {
            const vendedorSelect = document.getElementById(`vendedorNV${registroNum}`);
            const vendedorOtro = document.getElementById(`vendedorNV${registroNum}_otro`);
            
            if (vendedorSelect && vendedorOtro) {
                vendedorSelect.addEventListener('change', () => {
                    if (vendedorSelect.value === 'OTRO') {
                        vendedorOtro.classList.add('show');
                        vendedorOtro.required = true;
                    } else {
                        vendedorOtro.classList.remove('show');
                        vendedorOtro.required = false;
                        vendedorOtro.value = '';
                    }
                });
            }
        }

        function previewFile(registroNum, fotoNum, file) {
            const preview = document.getElementById(`previewNV${registroNum}_${fotoNum}`);
            
            preview.innerHTML = '';
            
            if (file) {
                const small = document.createElement('small');
                small.textContent = 'Cargando...';
                preview.appendChild(small);

                const reader = new FileReader();
                reader.onload = e => {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Previsualización"><button type="button" class="remove-photo-btn" title="Quitar foto" style="display:flex;">X</button>`;
                    
                    const btnCamera = preview.parentElement.querySelector('.photo-buttons .photo-btn:first-child');
                    const btnGallery = preview.parentElement.querySelector('.photo-buttons .photo-btn:last-child');
                    if (btnCamera && btnGallery) {
                        btnCamera.classList.add('active');
                        btnGallery.classList.add('active');
                    }
                };
                reader.readAsDataURL(file);
            } else {
                const small = document.createElement('small');
                small.textContent = `Vista previa ${fotoNum}`;
                preview.appendChild(small);
                
                const btnCamera = preview.parentElement.querySelector('.photo-buttons .photo-btn:first-child');
                const btnGallery = preview.parentElement.querySelector('.photo-buttons .photo-btn:last-child');
                if (btnCamera && btnGallery) {
                    btnCamera.classList.remove('active');
                    btnGallery.classList.remove('active');
                }
            }
        }

        function inicializarPrevisualizaciones(registroNum) {
            for (let fotoNum = 1; fotoNum <= 3; fotoNum++) {
                const inputCamera = document.getElementById(`photoNV${registroNum}_${fotoNum}_camera`);
                const inputGallery = document.getElementById(`photoNV${registroNum}_${fotoNum}_gallery`);
                const preview = document.getElementById(`previewNV${registroNum}_${fotoNum}`);
                
                if (inputCamera) {
                    inputCamera.addEventListener('change', (e) => {
                        if (e.target.files[0]) {
                            const dt = new DataTransfer();
                            dt.items.add(e.target.files[0]);
                            inputGallery.files = dt.files;
                            previewFile(registroNum, fotoNum, e.target.files[0]);
                        }
                    });
                }
                
                if (inputGallery) {
                    inputGallery.addEventListener('change', (e) => {
                        if (e.target.files[0]) {
                            const dt = new DataTransfer();
                            dt.items.add(e.target.files[0]);
                            inputCamera.files = dt.files;
                            previewFile(registroNum, fotoNum, e.target.files[0]);
                        }
                    });
                }
                
                if (preview) {
                    preview.addEventListener('click', (e) => {
                        if (e.target.classList.contains('remove-photo-btn')) {
                            inputCamera.value = '';
                            inputGallery.value = '';
                            previewFile(registroNum, fotoNum, null);
                        }
                    });
                }
            }
        }

        function setInitialDateTime(registroNum) {
            const now = new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const formattedDateTime = `${year}-${month}-${day}T${hours}:${minutes}`;
            
            const fechaInput = document.getElementById(`fechaNV${registroNum}`);
            if (fechaInput) {
                fechaInput.value = formattedDateTime;
            }
        }

        function actualizarRegistros() {
            const cantidad = parseInt(cantidadRegistrosSelect.value);
            totalTabs = cantidad;
            currentTab = 1;
            
            // Limpiar pestañas
            tabsNav.innerHTML = '';
            tabsContent.innerHTML = '';
            
            // Crear botones de pestañas
            for (let i = 1; i <= cantidad; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `tab-button ${i === 1 ? 'active' : ''}`;
                btn.id = `tabButton${i}`;
                btn.textContent = `NV ${i}`;
                btn.onclick = () => cambiarTab(i);
                tabsNav.appendChild(btn);
            }
            
            // Crear contenido de pestañas
            for (let i = 1; i <= cantidad; i++) {
                tabsContent.innerHTML += crearRegistro(i);
            }
            
            // Mostrar primera pestaña
            const firstTab = document.getElementById('tabContent1');
            if (firstTab) {
                firstTab.classList.add('active');
            }
            
            // Inicializar cada registro
            for (let i = 1; i <= cantidad; i++) {
                setInitialDateTime(i);
                inicializarPrevisualizaciones(i);
                configurarCamposCondicionales(i);
            }
            
            if (cantidad > 1) {
                submitButton.innerHTML = `💾 Guardar ${cantidad} Notas de Venta`;
            } else {
                submitButton.innerHTML = '💾 Guardar Nota de Venta';
            }
        }

        // --- SISTEMA DE COMPRESIÓN DE IMÁGENES ---
        function comprimirImagen(file) {
            return new Promise((resolve, reject) => {
                if (!file) return resolve(null);
                
                if (!file.type.match(/image.*/)) {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve({
                        fileName: file.name,
                        mimeType: file.type,
                        base64Data: e.target.result.split(',')[1]
                    });
                    reader.readAsDataURL(file);
                    return;
                }

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', QUALITY);
                        const base64String = dataUrl.split(',')[1];
                        
                        resolve({
                            fileName: file.name,
                            mimeType: 'image/jpeg',
                            base64Data: base64String
                        });
                    };
                    img.onerror = (err) => reject(new Error("Error al procesar imagen interna"));
                };
                reader.onerror = (err) => reject(new Error("Error de lectura de archivo"));
            });
        }

        // --- RECOPILAR DATOS ---
        async function recopilarDatosRegistro(registroNum) {
            const numeroNV = document.getElementById(`numeroNV${registroNum}`);
            const turnoNV = document.getElementById(`turnoNV${registroNum}`);
            const statusNV = document.getElementById(`statusNV${registroNum}`);
            const observacionesNV = document.getElementById(`observacionesNV${registroNum}`);
            
            // Si los campos no existen o están vacíos, retornar null
            if (!numeroNV || !numeroNV.value.trim() || 
                !turnoNV || !turnoNV.value.trim() || 
                !statusNV || !statusNV.value) {
                return null;
            }
            
            const vendedorSelect = document.getElementById(`vendedorNV${registroNum}`).value;
            const vendedorOtro = document.getElementById(`vendedorNV${registroNum}_otro`).value.trim();
            const vendedorNV = vendedorSelect === 'OTRO' ? vendedorOtro : vendedorSelect;
            
            if (!vendedorNV) {
                return null;
            }
            
            const photo1Camera = document.getElementById(`photoNV${registroNum}_1_camera`);
            const photo1Gallery = document.getElementById(`photoNV${registroNum}_1_gallery`);
            
            if (!photo1Camera.files[0] && !photo1Gallery.files[0]) {
                return null;
            }
            
            const photoPromises = [
                comprimirImagen(photo1Camera.files[0] || photo1Gallery.files[0]),
                comprimirImagen(document.getElementById(`photoNV${registroNum}_2_camera`).files[0] || document.getElementById(`photoNV${registroNum}_2_gallery`).files[0]),
                comprimirImagen(document.getElementById(`photoNV${registroNum}_3_camera`).files[0] || document.getElementById(`photoNV${registroNum}_3_gallery`).files[0])
            ];
            
            const [photoInfo1, photoInfo2, photoInfo3] = await Promise.all(photoPromises);
            
            return {
                fechaNV: new Date().toISOString(),
                numeroNV: numeroNV.value.trim(),
                turnoNV: turnoNV.value.trim(),
                vendedorNV,
                statusNV: statusNV.value,
                observacionesNV: observacionesNV.value.trim(),
                photoInfo1,
                photoInfo2,
                photoInfo3
            };
        }

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            actualizarRegistros();
        });

        cantidadRegistrosSelect.addEventListener('change', () => {
            actualizarRegistros();
        });

        // --- ENVÍO DEL FORMULARIO ---
        nvForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            hideStatus();

            const ejecutorValue = ejecutorSelect.value;
            let ejecutor = ejecutorValue;
            if (ejecutorValue === 'OTRO') {
                ejecutor = ejecutorOtro.value.trim();
                if (!ejecutor) {
                    showStatus('Error: Debes especificar el nombre del ejecutor.', 'error');
                    return;
                }
            } else if (!ejecutorValue) {
                showStatus('Error: Debes seleccionar un ejecutor.', 'error');
                return;
            }

            const cantidadSeleccionada = parseInt(cantidadRegistrosSelect.value);
            
            // Recopilar datos válidos
            const registrosPromises = [];
            for (let i = 1; i <= cantidadSeleccionada; i++) {
                registrosPromises.push(recopilarDatosRegistro(i));
            }
            
            const todosLosRegistros = await Promise.all(registrosPromises);
            const registrosValidos = todosLosRegistros.filter(r => r !== null);
            const cantidadReal = registrosValidos.length;
            
            // Si no hay registros válidos
            if (cantidadReal === 0) {
                showStatus('Error: No hay registros completos para subir. Completa al menos una nota de venta.', 'error');
                return;
            }
            
            // Si la cantidad real es diferente a la seleccionada, confirmar
            if (cantidadReal !== cantidadSeleccionada) {
                mostrarModal(
                    `Seleccionaste ${cantidadSeleccionada} registros pero solo ${cantidadReal} están completos. ¿Deseas subir solo los ${cantidadReal} registros completos?`,
                    async () => {
                        await procesarEnvio(ejecutor, registrosValidos, cantidadReal);
                    }
                );
            } else {
                await procesarEnvio(ejecutor, registrosValidos, cantidadReal);
            }
        });

        async function procesarEnvio(ejecutor, registrosData, cantidad) {
            toggleSubmitButton(true, '⏳ Comprimiendo y Enviando...');
            showStatus(`Procesando imágenes y enviando ${cantidad} registro(s)...`, 'loading');

            try {
                registrosData.forEach(registro => {
                    registro.user = ejecutor;
                });
                
                showStatus(`Enviando datos optimizados al servidor...`, 'loading');

                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        registros: registrosData,
                        cantidadRegistros: cantidad
                    })
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    showStatus(
                        result.message || `¡${cantidad} nota(s) de venta guardada(s) con éxito!`, 
                        'success'
                    );
                    nvForm.reset();
                    cantidadRegistrosSelect.value = '1';
                    actualizarRegistros();
                } else {
                    throw new Error(result.message || 'Ocurrió un error desconocido en el servidor.');
                }

            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                console.error('Error en el proceso de envío:', error);
            } finally {
                toggleSubmitButton(false, '💾 Guardar Nota de Venta');
                setTimeout(hideStatus, 10000);
            }
        }
    </script>

    <!-- ================= MODO DEVOLUCIÓN (script independiente) ================= -->
    <script>
    (() => {
        // URL de la aplicación web "Devoluciones AROMAKER" (Implementar → la que termina en /exec).
        const DEVOLUCIONES_URL = 'https://script.google.com/macros/s/AKfycbx4lTOG1I_r8glp1GYvysj37NuRy0m_7rDNrmIeRX2MAEW01tRvqo4hw9nioextNWgg0w/exec';

        const CANALES = ['Nota de venta', 'Mercado Libre', 'Falabella', 'Ripley', 'Líder', 'Paris', 'Web / Shopify', 'Otro'];
        const VENDEDORES = ['AF', 'YR', 'LC', 'JG', 'BF', 'ADM', 'Otro']; // mismos del registro de NV
        const ESTADOS = [
            { v: 'BUENO', t: '🟢 Bueno (vuelve a stock)', c: 'verde' },
            { v: 'MALO', t: '🔴 Malo / dañado', c: 'rojo' },
            { v: 'PARCIAL', t: '🟠 Parte bueno, parte malo', c: 'naranja' },
            { v: 'POR REVISAR', t: '⚪ Por revisar', c: '' }
        ];
        const MOTIVOS = ['Cliente se arrepintió', 'Producto equivocado', 'Llegó dañado', 'Falla / defecto', 'No retirado / rechazado', 'Otro'];
        const RESOLUCIONES = [
            { v: 'POR DEFINIR', t: 'Por definir', c: '' },
            { v: 'NOTA DE CRÉDITO', t: 'Nota de crédito', c: 'verde' },
            { v: 'CONSUMO', t: 'Consumo', c: 'naranja' },
            { v: 'CAMBIO DE PRODUCTO', t: 'Cambio de producto', c: 'verde' }
        ];
        const LADO_MAX = 1440;
        const CALIDAD_JPG = 0.72;
        const SUBIDAS_SIMULTANEAS = 2;

        const $ = id => document.getElementById(id);

        const st = {
            id: nuevoId(),
            canal: null, vendedor: null, estado: null, motivo: null,
            resolucion: 'POR DEFINIR',
            fotos: [],      // { miniatura, base64, estado: 'cola'|'subiendo'|'ok'|'error', fileId, url }
            subiendo: 0,
            guardando: false,
            listaCargada: false,
            modo: 'nv'
        };

        // ------------------------------------------------------------------
        // Utilidades
        // ------------------------------------------------------------------

        function nuevoId() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            return `DEV-${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
        }

        async function llamar(accion, datos) {
            if (!DEVOLUCIONES_URL || DEVOLUCIONES_URL.indexOf('PEGA_AQUI') !== -1) {
                throw new Error('Falta configurar la URL de Devoluciones en la página');
            }
            const respuesta = await fetch(DEVOLUCIONES_URL, {
                method: 'POST',
                mode: 'cors',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(Object.assign({ accion }, datos || {}))
            });
            const json = await respuesta.json();
            if (json.status !== 'success') throw new Error(json.message || 'Error del servidor');
            return json.data;
        }

        let temporizadorToast = null;
        function toast(texto, esError) {
            const t = $('devToast');
            t.textContent = texto;
            t.className = esError ? 'error' : '';
            t.style.display = 'block';
            clearTimeout(temporizadorToast);
            temporizadorToast = setTimeout(() => { t.style.display = 'none'; }, esError ? 5000 : 2600);
        }

        function leerLocal(clave) { try { return localStorage.getItem(clave) || ''; } catch (e) { return ''; } }
        function guardarLocal(clave, valor) { try { localStorage.setItem(clave, valor); } catch (e) { /* sin almacenamiento */ } }

        function escapar(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // ------------------------------------------------------------------
        // Cambio de modo (NV / devolución)
        // ------------------------------------------------------------------

        function cambiarModo(modo) {
            const dev = modo === 'devolucion';
            st.modo = dev ? 'devolucion' : 'nv';
            $('seccionNV').hidden = dev;
            $('botonGuardarNV').hidden = dev;
            $('seccionDev').hidden = !dev;
            $('botonGuardarDev').hidden = !dev;
            $('encabezado').classList.toggle('modo-dev', dev);
            $('tituloPagina').textContent = dev ? 'Registro de Devoluciones' : 'Registro de Nota de Venta';
            $('subtituloPagina').textContent = dev ? 'Fotos, estado y resolución de cada devolución' : 'Sistema de pestañas para registro múltiple';
            $('botonModoNV').classList.toggle('activo', !dev);
            $('botonModoDev').classList.toggle('activo', dev);
            try {
                history.replaceState(null, '', dev ? '#devolucion' : location.pathname + location.search);
            } catch (e) { /* solo cosmético */ }
            if (dev && !st.listaCargada) cargarLista();
            window.scrollTo({ top: 0 });
        }

        // ------------------------------------------------------------------
        // Chips
        // ------------------------------------------------------------------

        function dibujarChips(contenedorId, opciones, clave, alCambiar) {
            const cont = $(contenedorId);
            cont.innerHTML = '';
            opciones.forEach(op => {
                const o = typeof op === 'string' ? { v: op, t: op, c: '' } : op;
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'dev-chip' + (st[clave] === o.v ? ' sel ' + (o.c || '') : '');
                b.textContent = o.t;
                b.onclick = () => {
                    st[clave] = o.v;
                    dibujarChips(contenedorId, opciones, clave, alCambiar);
                    if (alCambiar) alCambiar(o.v);
                };
                cont.appendChild(b);
            });
        }

        function alCambiarCanal(canal) {
            const esNV = canal === 'Nota de venta';
            $('devBloqueVendedor').hidden = !esNV;
            if (!esNV) st.vendedor = null;
            $('devLblDocumento').textContent = esNV
                ? 'N° Nota de venta'
                : (canal === 'Otro' ? 'N° documento (si tiene)' : `N° de orden / venta ${canal}`);
            $('devLblDocumento').classList.toggle('required', canal !== 'Otro');
            dibujarChips('devChipsVendedor', VENDEDORES, 'vendedor', alCambiarVendedor);
        }

        function alCambiarVendedor(v) {
            if (v !== 'Otro') return;
            const nombre = (prompt('Nombre o sigla del vendedor') || '').trim();
            st.vendedor = nombre || null;
            const lista = nombre && !VENDEDORES.includes(nombre) ? VENDEDORES.slice(0, -1).concat([nombre, 'Otro']) : VENDEDORES;
            dibujarChips('devChipsVendedor', lista, 'vendedor', alCambiarVendedor);
        }

        function alCambiarResolucion(r) {
            const conNumero = r === 'NOTA DE CRÉDITO' || r === 'CONSUMO';
            $('devBloqueNumeroResol').hidden = !conNumero;
            $('devLblNumeroResol').textContent = r === 'CONSUMO' ? 'N° de consumo' : 'N° de nota de crédito';
            if (!conNumero) $('devNumeroResol').value = '';
        }

        // ------------------------------------------------------------------
        // Fotos: se comprimen en el teléfono y se suben apenas se toman
        // ------------------------------------------------------------------

        function comprimir(archivo) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(archivo);
                const img = new Image();
                img.onload = () => {
                    let w = img.naturalWidth, h = img.naturalHeight;
                    const mayor = Math.max(w, h);
                    if (mayor > LADO_MAX) { w = Math.round(w * LADO_MAX / mayor); h = Math.round(h * LADO_MAX / mayor); }
                    const lienzo = document.createElement('canvas');
                    lienzo.width = w; lienzo.height = h;
                    const ctx = lienzo.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    const grande = lienzo.toDataURL('image/jpeg', CALIDAD_JPG);

                    const m = 240 / Math.max(w, h);
                    const mini = document.createElement('canvas');
                    mini.width = Math.round(w * m); mini.height = Math.round(h * m);
                    mini.getContext('2d').drawImage(lienzo, 0, 0, mini.width, mini.height);

                    URL.revokeObjectURL(url);
                    resolve({ base64: grande.split(',')[1], miniatura: mini.toDataURL('image/jpeg', 0.7) });
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
                img.src = url;
            });
        }

        async function agregarArchivos(lista) {
            for (const archivo of Array.from(lista || [])) {
                try {
                    const { base64, miniatura } = await comprimir(archivo);
                    st.fotos.push({ miniatura, base64, estado: 'cola' });
                    dibujarGaleria();
                    procesarCola();
                } catch (e) {
                    toast(e.message, true);
                }
            }
        }

        function procesarCola() {
            while (st.subiendo < SUBIDAS_SIMULTANEAS) {
                const foto = st.fotos.find(f => f.estado === 'cola');
                if (!foto) break;
                subir(foto);
            }
            actualizarEstado();
        }

        async function subir(foto) {
            foto.estado = 'subiendo';
            st.subiendo++;
            dibujarGaleria();
            const idDev = st.id;
            try {
                const n = st.fotos.indexOf(foto) + 1;
                const r = await llamar('subirFoto', { idDev, nombre: `${idDev}_foto${n}.jpg`, base64: foto.base64 });
                foto.fileId = r.fileId;
                foto.url = r.url;
                foto.estado = 'ok';
                foto.base64 = null; // ya está en Drive, se libera memoria
                if (!st.fotos.includes(foto)) llamar('borrarFoto', { idDev, fileId: r.fileId }).catch(() => {}); // se quitó mientras subía
            } catch (e) {
                foto.estado = 'error';
                toast('Una foto no se pudo subir. Tócala para reintentar. (' + e.message + ')', true);
            } finally {
                st.subiendo--;
                dibujarGaleria();
                procesarCola();
            }
        }

        function dibujarGaleria() {
            const g = $('devGaleria');
            g.innerHTML = '';
            st.fotos.forEach((foto, i) => {
                const d = document.createElement('div');
                d.className = 'dev-foto' + (foto.estado === 'error' ? ' error' : '');
                const marca = { cola: '⏳ en cola', subiendo: '⬆️ subiendo', ok: '✅ Foto ' + (i + 1), error: '⚠️ reintentar' }[foto.estado];
                d.innerHTML = `<img src="${foto.miniatura}" alt=""><span class="marca">${marca}</span><button type="button" class="quitar">✕</button>`;
                d.querySelector('img').onclick = () => {
                    if (foto.estado === 'error') { foto.estado = 'cola'; procesarCola(); dibujarGaleria(); }
                };
                d.querySelector('.quitar').onclick = () => quitarFoto(foto);
                g.appendChild(d);
            });
            actualizarEstado();
        }

        function quitarFoto(foto) {
            if (!confirm('¿Quitar esta foto?')) return;
            st.fotos = st.fotos.filter(f => f !== foto);
            if (foto.estado === 'ok' && foto.fileId) llamar('borrarFoto', { idDev: st.id, fileId: foto.fileId }).catch(() => {});
            dibujarGaleria();
        }

        function actualizarEstado() {
            const total = st.fotos.length;
            const ok = st.fotos.filter(f => f.estado === 'ok').length;
            const err = st.fotos.filter(f => f.estado === 'error').length;
            let txt = total === 0 ? 'Sin fotos' : `Fotos ${ok}/${total} subidas`;
            if (err) txt += ` · ${err} con error`;
            $('devEstadoFotos').textContent = txt;
            const boton = $('botonDev');
            boton.disabled = st.guardando || (total > 0 && ok < total);
            boton.innerHTML = st.guardando
                ? '⏳ Guardando…'
                : (total > 0 && ok < total ? `⬆️ Subiendo fotos (${ok}/${total})…` : '↩️ Guardar devolución');
        }

        // ------------------------------------------------------------------
        // Aviso de documento con devoluciones anteriores (no bloquea)
        // ------------------------------------------------------------------

        let ultimoDocConsultado = '';
        async function revisarDocumento() {
            const doc = $('devDocumento').value.trim();
            const aviso = $('devAvisoDocumento');
            if (!doc || doc === ultimoDocConsultado) return;
            ultimoDocConsultado = doc;
            try {
                const previas = await llamar('buscarDocumento', { documento: doc });
                if ($('devDocumento').value.trim() !== doc) return;
                if (previas.length) {
                    aviso.innerHTML = `⚠️ Este documento ya tiene ${previas.length} devolución(es): ` +
                        previas.map(p => `${escapar(p.id)} (${escapar(p.fecha)}, ${escapar(p.resolucion)})`).join('; ') +
                        '. Puedes registrar otra si corresponde.';
                    aviso.hidden = false;
                } else {
                    aviso.hidden = true;
                }
            } catch (e) { aviso.hidden = true; }
        }

        // ------------------------------------------------------------------
        // Guardar
        // ------------------------------------------------------------------

        function validar() {
            if (!st.canal) return 'Elige el canal de la venta';
            if (st.canal === 'Nota de venta' && !st.vendedor) return 'Elige el vendedor';
            if (st.canal !== 'Otro' && !$('devDocumento').value.trim()) return 'Falta el número de documento';
            if (!$('devProducto').value.trim()) return 'Falta el producto devuelto';
            if (!st.estado) return 'Elige el estado del producto';
            if (st.fotos.length === 0) return 'Agrega al menos una foto';
            if (st.fotos.some(f => f.estado !== 'ok')) return 'Espera a que terminen de subir las fotos';
            if (!$('devRecibidoPor').value.trim()) return 'Escribe quién recibe la devolución';
            return null;
        }

        async function guardar() {
            if (st.guardando) return;
            const error = validar();
            if (error) { toast(error, true); return; }

            st.guardando = true;
            actualizarEstado();
            const recibidoPor = $('devRecibidoPor').value.trim();
            guardarLocal('dev_recibidoPor', recibidoPor);

            const datos = {
                id: st.id,
                canal: st.canal,
                documento: $('devDocumento').value.trim(),
                vendedor: st.vendedor || '',
                cliente: $('devCliente').value.trim(),
                producto: $('devProducto').value.trim(),
                cantidad: Number($('devCantidad').value) || 1,
                estado: st.estado,
                motivo: st.motivo || '',
                nota: $('devNota').value.trim(),
                resolucion: st.resolucion,
                numeroResolucion: $('devNumeroResol').value.trim(),
                recibidoPor,
                fotos: st.fotos.map(f => ({ fileId: f.fileId, url: f.url }))
            };

            try {
                const r = await llamar('guardarDevolucion', { datos });
                toast(r.yaExistia ? `${r.id} ya estaba guardada` : `✅ ${r.id} guardada`);
                reiniciar();
                cargarLista();
            } catch (e) {
                toast('No se pudo guardar: ' + e.message + '. Los datos siguen en pantalla, vuelve a tocar Guardar.', true);
            } finally {
                st.guardando = false;
                actualizarEstado();
            }
        }

        function reiniciar() {
            st.id = nuevoId();
            st.canal = st.vendedor = st.estado = st.motivo = null;
            st.resolucion = 'POR DEFINIR';
            st.fotos = [];
            ['devDocumento', 'devCliente', 'devProducto', 'devNota', 'devNumeroResol'].forEach(id => { $(id).value = ''; });
            $('devCantidad').value = 1;
            $('devAvisoDocumento').hidden = true;
            ultimoDocConsultado = '';
            $('devId').textContent = st.id;
            dibujarTodo();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ------------------------------------------------------------------
        // Lista de últimas devoluciones
        // ------------------------------------------------------------------

        async function cargarLista() {
            const cont = $('devLista');
            try {
                const items = await llamar('listarRecientes', { cantidad: 15 });
                st.listaCargada = true;
                if (!items.length) { cont.innerHTML = '<div class="dev-lista-item l2">Aún no hay devoluciones registradas.</div>'; return; }
                cont.innerHTML = items.map(x => {
                    const cerrada = x.gestion === 'CERRADA';
                    const resol = x.resolucion + (x.numeroResolucion ? ` N° ${x.numeroResolucion}` : '');
                    return `<div class="dev-lista-item">
                        <div class="l1">${escapar(x.canal)} ${escapar(x.documento)}
                            <span class="dev-etiqueta ${cerrada ? 'cerr' : 'pend'}">${escapar(x.gestion || 'PENDIENTE')}</span></div>
                        <div class="l2">${escapar(x.id)} · ${escapar(x.fecha)} · ${escapar(x.estado)} · ${x.fotos} 📷</div>
                        <div class="l2">${escapar(x.producto).slice(0, 90)} · ${escapar(resol)}</div>
                    </div>`;
                }).join('');
            } catch (e) {
                cont.innerHTML = `<div class="dev-lista-item l2">No se pudo cargar la lista: ${escapar(e.message)}</div>`;
            }
        }

        // ------------------------------------------------------------------
        // Inicio
        // ------------------------------------------------------------------

        function dibujarTodo() {
            dibujarChips('devChipsCanal', CANALES, 'canal', alCambiarCanal);
            dibujarChips('devChipsEstado', ESTADOS, 'estado');
            dibujarChips('devChipsMotivo', MOTIVOS, 'motivo');
            dibujarChips('devChipsResolucion', RESOLUCIONES, 'resolucion', alCambiarResolucion);
            $('devBloqueVendedor').hidden = true;
            $('devLblDocumento').textContent = 'N° documento';
            $('devLblDocumento').classList.remove('required');
            alCambiarResolucion(st.resolucion);
            dibujarGaleria();
        }

        $('devId').textContent = st.id;
        $('devRecibidoPor').value = leerLocal('dev_recibidoPor');
        $('devMenos').onclick = () => { $('devCantidad').value = Math.max(1, (Number($('devCantidad').value) || 1) - 1); };
        $('devMas').onclick = () => { $('devCantidad').value = (Number($('devCantidad').value) || 0) + 1; };
        $('devBotonCamara').onclick = () => $('devInputCamara').click();
        $('devBotonGaleria').onclick = () => $('devInputGaleria').click();
        $('devInputCamara').onchange = e => { agregarArchivos(e.target.files); e.target.value = ''; };
        $('devInputGaleria').onchange = e => { agregarArchivos(e.target.files); e.target.value = ''; };
        $('devDocumento').addEventListener('blur', revisarDocumento);
        $('botonDev').onclick = guardar;
        $('devRecargar').onclick = cargarLista;
        $('botonModoNV').onclick = () => cambiarModo('nv');
        $('botonModoDev').onclick = () => cambiarModo('devolucion');

        window.addEventListener('beforeunload', e => {
            if (st.fotos.length || $('devProducto').value.trim()) { e.preventDefault(); e.returnValue = ''; }
        });

        dibujarTodo();
        // Abrir directo en modo devolución si el enlace termina en #devolucion
        if (location.hash === '#devolucion') cambiarModo('devolucion');
    })();
    </script>
